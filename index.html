<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote ID Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --bg:#f6f7f4; --panel:#ffffff; --ink:#1c2420; --muted:#66706a; --line:#d9ded8; --drone:#d4380d; --op:#1d6fb8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b18; --panel:#1f2622; --ink:#e8ece9; --muted:#97a19a; --line:#303a34; --drone:#ff7a45; --op:#5aa9f0; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  #status { font-size:13px; color:var(--muted); }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; }
  #list { width:300px; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; line-height:1.5; }
  .item b { font-size:14px; }
  .item.stale { opacity:.5; }
  .muted { color:var(--muted); }
  #empty { padding:14px; color:var(--muted); font-size:13px; }
  @media (max-width: 700px) {
    main { flex-direction:column; }
    #list { width:100%; height:35%; border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Remote ID Map</h1>
  <span id="status">Not connected</span>
  <button id="sound">Sound on</button>
  <button id="me">Me</button>
  <button id="connect">Connect scanner</button>
</header>
<main>
  <div id="map"></div>
  <div id="list"><div id="empty">No drones yet. Connect the scanner and wait for a broadcast.</div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const STALE_MS = 60000;

const map = L.map("map").setView([54.7, 21.1], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const drones = {};   // key: mac
let fitted = false;

// ----- My location -----
const me = L.circleMarker([0, 0], { radius: 7, color: "#fff", weight: 2, fillColor: "#2e9e5b", fillOpacity: 1 });
const meAcc = L.circle([0, 0], { radius: 0, color: "#2e9e5b", weight: 1, fillOpacity: .1 });
let myPos = null, centeredOnMe = false;

function startLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude];
    me.setLatLng(myPos).addTo(map);
    meAcc.setLatLng(myPos).setRadius(p.coords.accuracy).addTo(map);
    me.bindTooltip("You");
    if (!fitted && !centeredOnMe) { map.setView(myPos, 15); centeredOnMe = true; }
  }, e => console.warn("Location error", e.message), { enableHighAccuracy: true, maximumAge: 5000 });
}

function distText(d) {
  if (!myPos || !d.loc) return "";
  const m = map.distance(myPos, [d.lat, d.lon]);
  return " · " + (m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m") + " from you";
}

// ----- Alerts and keep-alive -----
let soundOn = true, audioCtx = null, keepAudio = null, wakeLock = null;

function tone(f, start, dur) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}

function alertNew() {
  if (!soundOn) return;
  if (audioCtx) {
    audioCtx.resume();
    tone(880, 0, .18); tone(1175, .22, .18); tone(880, .44, .18); tone(1175, .66, .3);
  }
  if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 250]);
}

// 1 second of silence, looped, so the browser treats the page as playing media
function silentWav() {
  const n = 8000, b = new DataView(new ArrayBuffer(44 + n));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n, true); w(8, "WAVEfmt ");
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, 8000, true); b.setUint32(28, 8000, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true);
  w(36, "data"); b.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}

async function initAlerts() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch (e) {}
  try {
    if (!keepAudio) { keepAudio = new Audio(silentWav()); keepAudio.loop = true; }
    await keepAudio.play();
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: "Remote ID scanner running" });
  } catch (e) {}
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && statusEl.textContent.startsWith("Connected")) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});

startLocation();

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function update(m) {
  let d = drones[m.mac];
  const alertNow = !d || Date.now() - d.seen > STALE_MS;
  if (!d) {
    d = drones[m.mac] = { track: [], seen: 0 };
    d.marker = L.circleMarker([0, 0], { radius: 9, color: css("--drone"), fillColor: css("--drone"), fillOpacity: .8 });
    d.trail = L.polyline([], { color: css("--drone"), weight: 2, opacity: .6 });
    d.opMarker = L.circleMarker([0, 0], { radius: 6, color: css("--op"), fillColor: css("--op"), fillOpacity: .8 });
    d.link = L.polyline([], { color: css("--op"), weight: 1, dashArray: "4 6" });
  }
  Object.assign(d, m, { seen: Date.now() });
  if (alertNow) alertNew();

  if (m.loc) {
    const p = [m.lat, m.lon];
    d.marker.setLatLng(p).addTo(map);
    d.track.push(p); if (d.track.length > 200) d.track.shift();
    d.trail.setLatLngs(d.track).addTo(map);
    if (!fitted) { map.setView(p, 16); fitted = true; }
  }
  if (m.hasop) {
    d.opMarker.setLatLng([m.olat, m.olon]).addTo(map);
    if (m.loc) d.link.setLatLngs([[m.lat, m.lon], [m.olat, m.olon]]).addTo(map);
  }
  d.marker.bindTooltip(esc(d.id || d.mac), { permanent: true, direction: "top", offset: [0, -8] });
  d.opMarker.bindTooltip("Operator " + esc(d.op || "(unknown)"));
  render();
}

function render() {
  const list = document.getElementById("list");
  const keys = Object.keys(drones).sort((a, b) => drones[b].seen - drones[a].seen);
  if (!keys.length) return;
  list.innerHTML = keys.map(k => {
    const d = drones[k], age = Math.round((Date.now() - d.seen) / 1000);
    return `<div class="item ${Date.now() - d.seen > STALE_MS ? "stale" : ""}" data-k="${k}">
      <b>${esc(d.id || "Unknown ID")}</b><br>
      Operator ID: ${esc(d.op || "not received")}<br>
      <span class="muted">${d.loc ? `${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}` : "No position yet"}${distText(d)}</span><br>
      <span class="muted">${d.loc ? `Alt ${d.alt} m · ${d.spd} m/s · ` : ""}${esc(d.src)} ${d.rssi} dBm · ${age}s ago</span>
    </div>`;
  }).join("");
}

document.getElementById("list").addEventListener("click", e => {
  const el = e.target.closest(".item"); if (!el) return;
  const d = drones[el.dataset.k];
  if (d && d.loc) map.setView([d.lat, d.lon], 17);
});
setInterval(render, 1000);

// ----- Bluetooth -----
const statusEl = document.getElementById("status");
let buf = "";
const dec = new TextDecoder();

function onData(ev) {
  buf += dec.decode(ev.target.value);
  let i;
  while ((i = buf.indexOf("\n")) >= 0) {
    const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
    if (!line) continue;
    try { update(JSON.parse(line)); } catch (e) { console.warn("Bad line", line); }
  }
}

async function connect() {
  initAlerts();
  if (!navigator.bluetooth) {
    statusEl.textContent = "Web Bluetooth not supported. Use Chrome on Android.";
    return;
  }
  try {
    statusEl.textContent = "Choose your scanner...";
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    dev.addEventListener("gattserverdisconnected", () => { statusEl.textContent = "Disconnected"; });
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const ch = await svc.getCharacteristic(TX);
    ch.addEventListener("characteristicvaluechanged", onData);
    await ch.startNotifications();
    buf = "";
    statusEl.textContent = "Connected to " + dev.name;
  } catch (e) {
    statusEl.textContent = "Connection failed: " + e.message;
  }
}
document.getElementById("connect").addEventListener("click", connect);
document.getElementById("sound").addEventListener("click", async e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "Sound on" : "Sound off";
  if (soundOn) { await initAlerts(); alertNew(); }
});
document.getElementById("me").addEventListener("click", () => { if (myPos) map.setView(myPos, 16); });
</script>
</body>
</html>
